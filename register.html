<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Petmos Courses</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-box {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 35px 25px;
      border-radius: 15px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #111827;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      line-height: 1.5;
    }

    .login-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="register-box">

    <h1>Petmos Courses</h1>

    <p class="subtitle">Create your student account</p>

    <form id="registerForm">

      <label for="name">Full Name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
        required
      >

      <label for="email">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <button type="submit" id="registerButton">
        Create Account
      </button>

    </form>

    <p id="message" class="message"></p>

    <a href="login.html" class="login-link">
      Already have an account? Login
    </a>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://vrozqxqfztiatuspuonx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_lDOWrYQVC1Zj819W8NFZeg_5mFONJcJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      button.disabled = true;
      button.textContent = "Creating account...";
      message.textContent = "";
const { data, error } = await supabaseClient.auth.signUp({
  email: email,
  password: password,
  options: {
    emailRedirectTo:
      "https://mosespeterdaberechi-create.github.io/Course-Program/login.html",

    data: {
      full_name: name
    }
  }
});

      if (error) {
        message.textContent = error.message;
        button.disabled = false;
        button.textContent = "Create Account";
        return;
      }

      message.textContent =
        "Account created successfully. Check your email if verification is required.";

      form.reset();

      button.disabled = false;
      button.textContent = "Create Account";
    });
  </script>

</body>
</html>
