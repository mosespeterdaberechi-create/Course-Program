<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - Petmos Courses</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
    }

    header h1 {
      margin-bottom: 8px;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .course {
      padding: 18px;
      background: #f3f4f6;
      border-radius: 10px;
      margin-top: 15px;
    }

    .course h3 {
      margin-bottom: 8px;
    }

    .course a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      background: #111827;
      color: white;
      text-decoration: none;
      border-radius: 7px;
    }

    #logoutButton {
      margin-top: 20px;
      padding: 12px 20px;
      border: none;
      border-radius: 7px;
      background: #dc2626;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    #loading {
      text-align: center;
      padding: 50px 20px;
    }
  </style>
</head>

<body>

  <div id="loading">
    <h2>Loading your dashboard...</h2>
  </div>

  <div id="dashboard" style="display:none;">

    <header>
      <h1>Petmos Courses</h1>
      <p>Student Dashboard</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>Welcome, <span id="studentName">Student</span> 👋🏾</h2>
        <p style="margin-top:10px;">
          You are logged in successfully.
        </p>
      </div>

      <div class="card">
        <h2>My Courses</h2>

        <div class="course">
          <h3>Zero to Affiliate Income</h3>
          <p>Learn the fundamentals of affiliate marketing and how to build online income.</p>

          <a href="course.html">Open Course</a>
        </div>

      </div>

      <button id="logoutButton">Logout</button>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://vrozqxqfztiatuspuonx.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_lDOWrYQVC1Zj819W8NFZeg_5mFONJcJ";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

    async function loadDashboard() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (!session) {
        window.location.href = "login.html";
        return;
      }

      const user = session.user;

      const name =
        user.user_metadata?.full_name ||
        user.email?.split("@")[0] ||
        "Student";

      document.getElementById("studentName").textContent = name;

      document.getElementById("loading").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
    }

    document.getElementById("logoutButton").addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        window.location.href = "login.html";
      }
    );

    loadDashboard();
  </script>

</body>
</html>
